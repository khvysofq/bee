services:
  postgres:
    image: postgres:16-alpine
    container_name: bee-postgres
    environment:
      POSTGRES_USER: bee
      POSTGRES_PASSWORD: bee
      POSTGRES_DB: bee
    ports:
      - "5432:5432"
    volumes:
      - bee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bee -d bee"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  bee-pgdata:
